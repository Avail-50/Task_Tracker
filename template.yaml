AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sam-app

  Sample SAM Template for sam-app

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 10

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskID
          AttributeType: S
      KeySchema:
        - AttributeName: taskID
          KeyType: HASH

  TaskManagerFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: task_manager/
      Handler: app.task_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Events:
        CreateTask:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /tasks
            Method: post
        ListTask:
          Type: Api
          Properties:
            Path: /tasks
            Method: get
        UpdateTask:
          Type: Api
          Properties:
            Path: /tasks/{taskID}
            Method: patch
        
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable


Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  TasksApi:
    Description: "API Gateway endpoint URL for the Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/tasks"
  TaskManagerFunction:
    Description: "Task manager Lambda function ARN"
    Value: !GetAtt TaskManagerFunction.Arn
  TaskManagerFunctionIamRole:
    Description: "Implicit IAM role created for the task manager function"
    Value: !GetAtt TaskManagerFunctionRole.Arn
